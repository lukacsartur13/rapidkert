# Publish the PRODUCTION BUILD to GitHub Pages.                 [PHASE 3.2C]
#
# Until this exists, Pages serves the repository root — which is the SOURCE
# tree: a 246KB render-blocking stylesheet, a 687KB Three.js bundle, two 40KB
# logo PNGs at three times the size they are displayed. `npm run build` turns
# that into dist/, and dist/ is what a visitor should be given.
#
# ACTIVATING THIS IS A REPOSITORY SETTING, NOT A FILE.
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#
# That switch was flipped on 2026-08-10 and this workflow is now what serves
# the site. Pushing to main builds dist/ and publishes it; nothing else does.
# If the setting is ever changed back to "Deploy from a branch", this workflow
# starts failing at actions/configure-pages — that is the symptom to look for,
# not a build problem.
#
# Cache lifetime: GitHub Pages sends `cache-control: max-age=600` on every
# response and offers no way to change it — no _headers file, no per-path
# configuration, nothing in the Pages API. Every generated asset here carries
# a content hash in its filename, which is the precondition for a host that
# CAN serve `immutable`; on GitHub Pages the hashes cost nothing and simply
# wait. See the HOSTING section of the Phase 3.2C report.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `ci`, not `install`: the lockfile is the build's contract. A fresh
      # clone must produce byte-identical output.
      - name: Install pinned dependencies
        run: npm ci

      # AVIF at effort 9 over forty plates is seven minutes on a fast laptop
      # and the best part of half an hour on a runner. The encoder cache is
      # keyed on the source images AND the encoder settings, so a quality
      # change still re-encodes and an unchanged library never does.
      - name: Restore the image encoder cache
        uses: actions/cache@v4
        with:
          path: .cache/img
          key: rk-img-${{ hashFiles('*.jpg', '*.png', 'build.mjs') }}
          restore-keys: rk-img-

      - name: Build
        run: npm run build

      # A build that silently dropped the stylesheet, the scripts or the
      # structured data would still produce a dist/ that looks fine in a
      # directory listing.
      - name: Verify the output
        run: |
          test -f dist/index.html
          test -f dist/en/index.html
          grep -q '<style>' dist/index.html
          grep -q 'rel="preload" href="rk\..*\.css" as="style"' dist/index.html
          grep -q '<noscript><link rel="stylesheet"' dist/index.html
          grep -q 'application/ld+json' dist/index.html
          test "$(ls dist/rk-ground.*.js | wc -l)" -eq 1
          test "$(ls dist/rk.*.js | wc -l)" -eq 1
          test "$(ls dist/rk.*.css | wc -l)" -eq 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Only main publishes. workflow_dispatch on another branch builds and
    # verifies without touching the live site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
